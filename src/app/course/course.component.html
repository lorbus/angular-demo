<div class="course">

  <ng-container *ngIf="!activeLesson;else detail">
    <h2>{{course?.description}}</h2>

    <!-- <img class="course-thumbnail" [src]="course?.iconUrl"> -->

    <!--
    <div class="spinner-container" *ngIf="loading">
    <mat-spinner></mat-spinner>
    </div>
    -->

  <div class="scrolling-container">

  <table mat-table class="lessons-table mat-elevation-z8" style="position: sticky; z-index: 10;"
       matSort matSortDisableClear matSortActive="seqNo" matSortDirection="asc"
       [dataSource]="lessons" multiTemplateDataRows>

  <!--
  <ng-container matColumnDef="select" sticky>
    <th mat-header-cell *matHeaderCellDef>

    <mat-checkbox [checked]="selection.hasValue() && isAllSelected()"
                  [indeterminate]="selection.hasValue() && !isAllSelected()"
                  (change)="toggleAll()">
    </mat-checkbox>
    </th>

    <td mat-cell *matCellDef="let lesson" (click)="$event.stopPropagation()">
      <mat-checkbox (change)="onLessonToggled(lesson)" [checked]="selection.isSelected(lesson)"></mat-checkbox>
    </td>
  </ng-container>
  -->

        <ng-container matColumnDef="seqNo">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Nr.</th>

          <td mat-cell *matCellDef="let lesson">{{lesson.seqNo}}</td>
        </ng-container>

        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Description</th>

          <td mat-cell *matCellDef="let lesson">{{lesson.description}}</td>
        </ng-container>

        <ng-container matColumnDef="duration">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Duration</th>

          <td class="duration-cell" mat-cell *matCellDef="let lesson">{{lesson.duration}}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true" style="position: sticky; z-index: 100;"></tr>

        <tr mat-row *matRowDef="let lesson; columns: displayedColumns" (click)="openLesson(lesson)"></tr>

  <!--
        <ng-container matColumnDef="expandedDetail">
          <td mat-cell *matCellDef="let lesson" colspan="4">{{lesson.longDescription}}</td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky:true"></tr>
        <tr mat-row (click)="onToggleLesson(lesson)" *matRowDef="let lesson;columns:displayedColumns"></tr>
        <tr mat-row *matRowDef="let lesson;columns:['expandedDetail']" [class.collapsed-detail]="lesson != expandedLesson"></tr>
  -->

      </table>

    </div>

    <mat-paginator class="mat-elevation-z8" [length]="course?.lessonsCount"
                   [pageSize]="5" [pageSizeOptions]="[5, 10, 50, 100]">
    </mat-paginator>
  </ng-container>

  <ng-template #detail>
    <lesson [lesson]="activeLesson"></lesson>

    <button mat-raised-button class="back-btn" (click)="onBackToCourses()"><mat-icon>arrow_back_ios</mat-icon>
      Back to Course
    </button>
  </ng-template>

</div>
